        <script type="text/javascript">
            $(document).ready(function(){

                $("li.item ol").hide();

                $("li.item").hover(
                    function(){
                        $("li.item ol").hide();
                        $(this).children("ol").show();
                    },
                    function(){
                        $(this).children("ol").hide();
                    }
                );

            });
        </script>

                background: deeppink;
                color: white;
                float: left;
                margin-right: 10px;
                position: relative;
                padding: 3px;
                cursor: pointer;
            }

            li.item ol{
                background: white;
                color: black;
                position: absolute;
                top: 25px;
                left: 0;
                width: 120px;
                padding: 5px;
                border: 2px solid deeppink;
            }

            li.item ol li{
                list-style: none;
            }

            a{
                text-decoration: underline;
                color: black;
            }

            li{
                text-decoration: underline;
            }

            .clear{
                clear: both;
            }
        </style>
    </head>
